name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e6985fd516cce3b1a0e8db34a4013d2e50a1e252 # v4.32.0
        with:
          languages: python,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@e6985fd516cce3b1a0e8db34a4013d2e50a1e252 # v4.32.0
