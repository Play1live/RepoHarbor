name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock && python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check . && ruff format --check . && mypy
  unit-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock && python -m pip install --no-build-isolation --no-deps -e .
      - run: pytest --cov --cov-report=xml --cov-report=json --cov-report=term-missing --junitxml=test-results/junit.xml
      - name: Coverage gates (90 line / 85 branch / 95 critical)
        run: python scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tests-coverage-${{ matrix.python }}
          path: |
            test-results/
            coverage.xml
            coverage.json
  fault-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock && python -m pip install --no-build-isolation --no-deps -e .
      - run: pytest tests/fault_injection --junitxml=test-results/fault-injection.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fault-injection
          path: test-results/
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock && python -m pip install --no-build-isolation --no-deps -e .
      - run: pip-audit --local --skip-editable
      - name: SAST (medium/high block; subprocess boundary reviewed in SECURITY)
        run: bandit -r src -ll
      - name: Secret scan (redacted)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --redact
  docker-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose -f deploy/compose.example.yaml config --quiet
      - run: docker build -t repoharbor:local-test .
      - run: python3 tests/docker/smoke.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPOHARBOR_BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements-dev.lock -r requirements-browser.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m playwright install --with-deps chromium
          pytest tests/integration/test_dashboard.py -k browser
  image-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          mkdir -p test-results/image-security
          docker build -t repoharbor:security .
          docker image inspect --format '{{.Id}}' repoharbor:security > test-results/image-security/image-id.txt
          docker save -o "${RUNNER_TEMP}/repoharbor-image.tar" repoharbor:security
      - name: Generate CycloneDX SBOM and scan Debian and Python packages
        run: |
          docker run --rm -v "${RUNNER_TEMP}/repoharbor-image.tar:/scan/image.tar:ro" \
            -v "$PWD/test-results/image-security:/out" "$TRIVY_IMAGE" image \
            --input /scan/image.tar --format cyclonedx --output /out/image.cdx.json
          docker run --rm -v "${RUNNER_TEMP}/repoharbor-image.tar:/scan/image.tar:ro" \
            -v "$PWD/test-results/image-security:/out" "$TRIVY_IMAGE" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 --input /scan/image.tar --scanners vuln --format json --output /out/vulnerabilities.json
          python - <<'PY_GATE'
          import json
          from pathlib import Path

          report = json.loads(Path("test-results/image-security/vulnerabilities.json").read_text())
          findings = [
              v for result in report.get("Results", [])
              for v in result.get("Vulnerabilities", [])
              if v.get("Severity") in ("HIGH", "CRITICAL") and v.get("FixedVersion")
          ]
          for v in findings:
              print(v["VulnerabilityID"], v["PkgName"], v["InstalledVersion"], v["FixedVersion"])
          raise SystemExit(bool(findings))
          PY_GATE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-security
          path: test-results/image-security/
